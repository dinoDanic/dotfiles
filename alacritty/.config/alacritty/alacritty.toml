[window]
padding = { x = 4, y = 4 }
decorations = "None"

[font]
normal = { family = "DejaVu Sans Mono" }
size = 11

[colors.primary]
background = "#000000"
foreground = "#d0d0d0"

[colors.cursor]
text = "#000000"
cursor = "#d0d0d0"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
mouse.enabled = true
binding = { key = "O", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
